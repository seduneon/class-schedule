[project]
name = "class-scheduler"
version = "0.1.0"
description = "Two-stage MILP class scheduling optimizer (MATH 499 capstone, Nazarbayev University)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pulp[cbc]>=4.0",
    "pydantic>=2.6",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
highs = ["highspy>=1.7"]
experiments = ["matplotlib>=3.8"]

[project.scripts]
scheduler = "scheduler.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "highspy>=1.7",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # long strings; formatter owns layout

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pulp", "pulp.*", "highspy", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
filterwarnings = ["error::DeprecationWarning"]
markers = ["slow: experiment-sized runs (deselected by default; run with -m slow)"]
